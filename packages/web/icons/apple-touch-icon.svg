<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>goleta</title>
  <!--
    The source for `apple-touch-icon.png`, which is not a resize of the tab
    icon. iOS puts this on a home screen and applies its own rounded mask, so
    the tile is square and full-bleed — rounding it here would only show up as a
    dark seam inside Apple's corners — and the ship runs a little larger to fill
    what the mask leaves. Same three colours, same schooner; see
    `../public/favicon.svg` for where they come from and why the card is gone
    (#370).

    Rebuild with `scripts/build-icons.sh`.
  -->
  <defs>
    <radialGradient id="felt" cx="0.5" cy="0" r="1.1">
      <stop offset="0" stop-color="#193b2a" />
      <stop offset="1" stop-color="#07180f" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" fill="url(#felt)" />

  <g transform="translate(32 32) scale(1.06) translate(-32 -32)">
    <g fill="#ffffff">
      <rect x="23" y="14" width="1.7" height="29" />
      <rect x="39.5" y="10" width="1.7" height="33" />
      <path d="M21.9 19 V42 H9.5 Z" />
      <path d="M25.9 16 V42 H35.5 Z" />
      <path d="M42.4 12 V42 H53.5 Z" />
      <path d="M7 44.5 H57 C 51 54.5, 14 54.5, 7 44.5 Z" />
    </g>
  </g>
</svg>
