<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <title>goleta</title>
  <!--
    The 16px layer of `favicon.ico`, drawn again rather than scaled down.

    At 16px the tab strip gets about fourteen pixels of tile. Scaled down, the
    64px drawing loses both masts to grey — a one-pixel spar landing between two
    columns is anti-aliased into nothing — so everything here sits square on the
    pixel grid: both masts are whole columns, and the deck and the sails' feet
    are whole rows.

    **The jib goes.** Three sails at this size merge into one blob across the
    bow; two triangles and two masts still say two-masted vessel, and the aft
    mast being the taller is the only detail that has to survive. Same three
    colours, same ship — see `../public/favicon.svg` for where they come from.

    Rebuild with `scripts/build-icons.sh`.
  -->
  <defs>
    <radialGradient id="felt" cx="0.5" cy="0" r="1.1">
      <stop offset="0" stop-color="#193b2a" />
      <stop offset="1" stop-color="#07180f" />
    </radialGradient>
  </defs>

  <rect width="16" height="16" rx="3.5" fill="url(#felt)" />

  <g fill="#ffffff">
    <rect x="4" y="4" width="1" height="7" />
    <rect x="9" y="2" width="1" height="9" />
    <path d="M5 4 V10 H8 Z" />
    <path d="M10 2 V10 H13 Z" />
    <!-- Tapered rather than square: two full-width rows read as a slab under the
         rig instead of as a hull. -->
    <path d="M1 11 H15 L12.8 13 H3.2 Z" />
  </g>
</svg>
