name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: lint + typecheck + test + docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Docker build (proves the image builds)
        run: docker build -t goleta:ci .
