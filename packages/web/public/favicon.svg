<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>goleta</title>
  <!--
    The felt, and a goleta — a two-masted, fore-and-aft rigged schooner, which
    is what the app is named after (#370). It was a tilted card with an eight on
    it until then, and at 32px in a tab strip that read as a pool ball on a card:
    the least distinctive thing a card game could put on a tab, with the name
    sitting right there unused.

    **The card did not survive.** A ship on a card is two competing silhouettes
    in a 16px box, and the tab strip is where a mark has to be recognisable
    rather than descriptive. The felt already says table.

    **The aft mast is taller than the fore.** That is the one detail that makes
    this a schooner rather than a generic sailboat, so it is the last thing that
    may go when everything else does.

    Hull, two masts, sails, and nothing else — no rigging, no flag, no sea. A
    rigging line is a hairline, and a hairline is the first thing to die on the
    way down to 16px. Everything is a filled path rather than a stroke for the
    same reason the eight was a path and not a `<text>` element: geometry lands
    the same in every rasteriser, and a stroke lands at whatever the renderer
    rounds it to.

    The colours below are copied out of the `@theme` block in `src/index.css`.
    Tailwind never sees this file — it is a static asset served as-is — so it
    cannot read the theme and will not follow a change to it. If the felt moves,
    move it here too. (The tile runs a step brighter than the table's own
    gradient so it still reads as green rather than black at 16px.)
  -->
  <defs>
    <radialGradient id="felt" cx="0.5" cy="0" r="1.1">
      <stop offset="0" stop-color="#193b2a" />
      <stop offset="1" stop-color="#07180f" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#felt)" />

  <g fill="#ffffff">
    <!-- Fore mast, then the main aft of it and taller. -->
    <rect x="23" y="14" width="1.7" height="29" />
    <rect x="39.5" y="10" width="1.7" height="33" />
    <!-- Jib, forward of the fore mast. -->
    <path d="M21.9 19 V42 H9.5 Z" />
    <!-- Both sails set aft of their mast, which is what fore-and-aft means. -->
    <path d="M25.9 16 V42 H35.5 Z" />
    <path d="M42.4 12 V42 H53.5 Z" />
    <!-- Flat deck, curved bottom: a slab reads as a bar rather than a hull. The
         felt between it and the sails is what keeps the two apart at 32px. -->
    <path d="M7 44.5 H57 C 51 54.5, 14 54.5, 7 44.5 Z" />
  </g>
</svg>
