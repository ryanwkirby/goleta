name: Deploy

# Continuous deployment to the Mac mini's OrbStack.
#
# Runs only on push to main (i.e. a merged PR) and on manual dispatch — never
# on pull_request — so untrusted branch code is never executed on the runner.
# The job runs on the self-hosted runner installed on the Mac mini, which is
# the only machine carrying the `goleta` label.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys overlap; queue them instead of cancelling. A redeploy
# restarts the process holding every live room, so the one thing worse than a
# deploy landing mid-game is two of them landing mid-game.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, goleta]
    steps:
      - name: Sync working tree to origin/main and (re)deploy
        working-directory: /Users/ryan/git/goleta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Authenticate the fetch with the workflow token. The runner is a
          # launchd agent with no access to the login keychain, so git's
          # osxkeychain credential helper can't supply HTTPS credentials.
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          # Force-checkout main to exactly match what we just fetched, whatever
          # branch the working tree happens to be on (deploy target tracks main).
          git checkout -B main FETCH_HEAD
          docker compose up -d --build
          docker image prune -f

      # `127.0.0.1` and not `localhost`, which resolves to `::1` first. The
      # container publishes on both stacks, but OrbStack's IPv6 forward is not
      # ready the instant a freshly recreated container starts, and an unready
      # forward *hangs* rather than refusing — so there is no connection error
      # to fall through to IPv4 on, and the stack that has been answering since
      # the first second never gets asked. `--max-time` is the other half: with
      # no cap, one attempt is 28 seconds of curl's own timeout rather than one
      # attempt, and thirty of those failed a landed deploy fourteen minutes
      # later (#154). The Dockerfile's own HEALTHCHECK has pinned v4 all along.
      #
      # Still `/` rather than `/healthz`: this is the check that the built web
      # bundle is being served, not only that the process came up.
      - name: Wait for healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8063/ >/dev/null 2>&1; then
              echo "Service healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Service failed health check; recent logs:"
          docker compose -f /Users/ryan/git/goleta/docker-compose.yml logs --tail=80 || true
          exit 1
