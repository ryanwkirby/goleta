<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The felt, so the browser's own chrome doesn't sit against the table in
         a colour the table has never used. Matches `--color-felt-950`, which is
         the page's background and the base of its gradient. -->
    <meta name="theme-color" content="#07180f" />
    <!-- `manifest.webmanifest` carries a copy of this sentence, which is how it
         went eight days stale once already (#371). Change both or neither. -->
    <meta name="description" content="Crazy Eights, reversed: you want to keep cards. 4 to 8 players, no accounts." />
    <!-- The .ico declares a size so a browser that can render the SVG prefers
         it; the .ico is for the ones that can't, and for whatever asks for
         /favicon.ico by name without reading the page at all. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Only the shared table screen ever offers an install, and it is a pilot
         (#126) — this link and the file it points at come out with it if the
         answer is no. `start_url` deliberately overrides iOS's default of
         pinning whatever URL you installed from: a room code expires, and a
         home-screen icon that opens a dead room is worse than a re-scan. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>goleta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
